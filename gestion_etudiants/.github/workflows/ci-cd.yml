name: CI/CD — GestEtudiant

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 : Lint + Tests
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-for-testing-only
      DEBUG: "True"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: "localhost 127.0.0.1"

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Mise en place de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint avec flake8
        run: |
          flake8 . --count --max-line-length=120 --exclude=migrations,__pycache__ --statistics

      - name: ✅ Tests Django
        run: |
          python manage.py test students --verbosity=2

      - name: 📊 Rapport de couverture (optionnel)
        run: |
          pip install coverage
          coverage run manage.py test students
          coverage report

  # ──────────────────────────────────────────────────────────
  # JOB 2 : Build de l'image Docker
  # ──────────────────────────────────────────────────────────
  build:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🏗️ Build de l'image Docker
        run: docker build -t gestion-etudiants:${{ github.sha }} .

      - name: 🔎 Vérification de l'image
        run: docker images gestion-etudiants

  # ──────────────────────────────────────────────────────────
  # JOB 3 : Publication sur Docker Hub (main uniquement)
  # ──────────────────────────────────────────────────────────
  publish:
    name: 🚀 Publication Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/gestion-etudiants
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build et Push vers Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
