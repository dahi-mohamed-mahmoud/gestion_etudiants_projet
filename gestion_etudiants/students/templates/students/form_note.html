{% extends 'students/base.html' %}
{% block title %}Ajouter une note{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2 text-primary"></i>Ajouter une note pour {{ etudiant.nom_complet }}</h2>
<div class="card" style="max-width:500px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label fw-semibold">Matière</label>{{ form.matiere }}</div>
            <div class="mb-3"><label class="form-label fw-semibold">Note (/20)</label>{{ form.note }}</div>
            <div class="mb-3"><label class="form-label fw-semibold">Session</label>{{ form.session }}</div>
            <div class="mb-3"><label class="form-label fw-semibold">Année académique</label>{{ form.annee_academique }}</div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'detail_etudiant' etudiant.pk %}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
