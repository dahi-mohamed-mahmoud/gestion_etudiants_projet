{% extends 'students/base.html' %} {% block title %}Supprimer cours{% endblock
%} {% block content %}
<div class="card border-danger">
  <div class="card-body p-4">
    <h3 class="text-danger fw-bold mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmer la
      suppression
    </h3>
    <p>
      Voulez-vous vraiment supprimer le cours
      <strong>{{ matiere.code }} - {{ matiere.nom }}</strong> ?
    </p>
    <p class="text-muted mb-4">Cette action est irréversible.</p>

    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash me-1"></i>Oui, supprimer
      </button>
      <a href="{% url 'liste_matieres' %}" class="btn btn-outline-secondary"
        >Annuler</a
      >
    </form>
  </div>
</div>
{% endblock %}
